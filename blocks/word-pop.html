<!-- block:
description: Kinetic typography for shorts: shows one word (or short phrase) at a time, big and centered, with a punchy pop. Separate phrases with |.
params: text (phrases separated by |), every (seconds per phrase, default 0.45), accent (color for words wrapped in *stars*), size (px at 1080p, default 170)
usage: <mw-include src="blocks/word-pop.html" text="Stop|editing|videos|*by hand*" every="0.5" data-duration="2.5"></mw-include>
-->
<div class="mwb-pop" style="--accent:{{accent|#ffd23f}};--size:{{size|170}}" data-text="{{text|Make|it|*move*}}" data-every="{{every|0.45}}"></div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const parts = root.dataset.text.split('|').map((s) => s.trim()).filter(Boolean);
  const every = parseFloat(root.dataset.every) || 0.45;
  parts.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'mwb-pop__w';
    const hl = /^\*(.*)\*$/.exec(p);
    el.textContent = hl ? hl[1] : p;
    if (hl) el.classList.add('is-hl');
    el.setAttribute('data-start', String(i * every));
    if (i < parts.length - 1) el.setAttribute('data-duration', String(every));
    root.appendChild(el);
  });
})();
</script>
<style>
.mwb-pop{position:absolute;inset:0;display:grid;place-items:center}
.mwb-pop__w{grid-area:1/1;font-size:calc(var(--px)*var(--size));font-weight:900;letter-spacing:-.04em;text-transform:uppercase;line-height:1;text-align:center;padding:0 calc(var(--px)*80);
  animation:mwb-pop-in .32s var(--ease-out-back) both}
.mwb-pop__w.is-hl{color:var(--accent)}
@keyframes mwb-pop-in{from{scale:1.6;opacity:0;filter:blur(calc(var(--px)*10))}}
</style>
