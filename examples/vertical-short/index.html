<!doctype html>
<html data-width="1080" data-height="1920" data-fps="30" data-duration="11">
<head>
<style>
  :root { --ink: #0d0c14; --lime: #c8ff3d; --violet: #8b6cff; --pink: #ff4f8b; --beat: 0; }
  body { background: var(--ink); color: #fff; font-family: "Inter Display", Inter, system-ui, sans-serif; margin: 0; }
  .mono { font-family: "DejaVu Sans Mono", monospace; }

  /* ---------- global layers ---------- */
  #bg { z-index: 0; }
  #flash { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 42%, rgba(200,255,61,.16), transparent 70%);
    opacity: calc(var(--beat) * 0.9); pointer-events: none; z-index: 1; }
  #progress { position: absolute; left: 0; top: 0; height: 10px; width: 100%; background: rgba(255,255,255,.12); z-index: 50; }
  #progress i { position: absolute; inset: 0; background: var(--lime); transform-origin: left center; transform: scaleX(0);
    box-shadow: 0 0 18px rgba(200,255,61,.8); }
  .gmb-cap--bottom { bottom: 430px !important; }
  .gmb-cap__line { font-family: Inter, sans-serif; font-weight: 900 !important; text-transform: uppercase; letter-spacing: -0.02em !important; }

  main { z-index: 5; }
  .scene { overflow: hidden; }
  .stage { position: absolute; left: 0; right: 0; top: 230px; height: 1050px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }

  /* ---------- scene 1: MAKE THIS WHOLE VIDEO ---------- */
  .vf { position: absolute; inset: 200px 70px 500px 70px; }
  .vf b { position: absolute; width: 90px; height: 90px; border: 0 solid var(--lime); }
  .vf b:nth-child(1) { left: 0; top: 0; border-width: 10px 0 0 10px; }
  .vf b:nth-child(2) { right: 0; top: 0; border-width: 10px 10px 0 0; }
  .vf b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 10px 10px; }
  .vf b:nth-child(4) { right: 0; bottom: 0; border-width: 0 10px 10px 0; }
  .rec { position: absolute; left: 130px; top: 245px; font: 700 40px/1 Inter, sans-serif; letter-spacing: .08em; display: flex; gap: 14px; align-items: center; }
  .rec::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 20px var(--pink); }
  .tc { position: absolute; right: 130px; top: 245px; font-size: 40px; opacity: .85; }
  .stack { width: 880px; display: flex; flex-direction: column; align-items: stretch; line-height: .86; font-weight: 900; text-transform: uppercase; letter-spacing: -0.045em; }
  .stack .ln { display: block; white-space: nowrap; text-align: center; clip-path: inset(-1em -1em 0 -1em); padding: 0 0 .05em; }
  .stack .w { display: inline-block; }
  .stack .accent { color: var(--lime); }
  .kicker { margin: 0 0 30px 0; font-size: 96px; font-weight: 900; letter-spacing: -0.03em; color: var(--ink);
    background: var(--lime); padding: 6px 28px 10px; border-radius: 18px; rotate: -6deg; align-self: center; }
  .kicker span { display: inline-block; }

  /* ---------- scene 2: ONE HTML FILE ---------- */
  .burst { position: absolute; left: 50%; top: 640px; width: 1800px; height: 1800px; translate: -50% -50%; overflow: visible; opacity: .5; }
  #pop { position: absolute; left: 0; top: 250px; width: 1080px; height: 1080px; overflow: visible; }
  #pop .ray { stroke: var(--lime); stroke-width: 16; stroke-linecap: round; }
  #shock { fill: none; stroke: #fff; stroke-width: 10; }
  .file { position: relative; width: 470px; height: 590px; }
  .file svg { position: absolute; inset: 0; overflow: visible; }
  .file .glyph { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 170px; font-weight: 900; color: var(--ink); letter-spacing: -0.06em; }
  .file .ext { position: absolute; left: 50%; bottom: 60px; translate: -50% 0; padding: 14px 30px; border-radius: 999px; background: var(--ink); color: var(--lime);
    font-size: 48px; font-weight: 700; white-space: nowrap; }
  .onefile { margin-top: 70px; font-size: 150px; font-weight: 900; letter-spacing: -0.045em; text-transform: uppercase; line-height: 1; }
  .onefile .accent { color: var(--lime); }

  /* ---------- scene 3: AI writes the code ---------- */
  .aihead { display: flex; align-items: center; gap: 30px; margin-bottom: 60px; font-size: 140px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; text-transform: uppercase; }
  .aihead .ai { color: var(--ink); background: var(--lime); padding: 0 .14em; border-radius: .14em; }
  .spark { width: 100px; height: 100px; overflow: visible; }
  .codewrap { width: 960px; }

  /* ---------- scene 4: givemotion renders every frame ---------- */
  .brand { font-size: 150px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
  .brand .m { color: var(--lime); }
  .strip { position: relative; margin-top: 90px; height: 420px; width: 100%; }
  .film { position: absolute; left: 0; top: 0; height: 420px; display: flex; gap: 0; padding: 40px 0; background: #18161f;
    border-top: 6px dashed rgba(255,255,255,.25); border-bottom: 6px dashed rgba(255,255,255,.25); }
  .fr { width: 200px; height: 340px; margin: 0 14px; border-radius: 18px; flex: none; display: grid; place-items: center;
    font-weight: 900; font-size: 64px; letter-spacing: -0.04em; text-transform: uppercase; overflow: hidden; }
  .fr:nth-child(4n+1) { background: var(--lime); color: var(--ink); }
  .fr:nth-child(4n+2) { background: var(--violet); }
  .fr:nth-child(4n+3) { background: #24212f; color: var(--lime); }
  .fr:nth-child(4n+4) { background: var(--pink); }
  .counter { margin-top: 70px; font-size: 64px; font-weight: 700; display: flex; gap: 22px; align-items: baseline; }
  .counter .n { color: var(--lime); font-size: 110px; font-weight: 800; }
  .counter .lbl { opacity: .7; }

  /* ---------- scene 5: HTML IN / VIDEO OUT ---------- */
  .io { font-size: 150px; font-weight: 900; letter-spacing: -0.05em; line-height: .92; text-transform: uppercase; text-align: center; }
  .io .row { display: block; clip-path: inset(-1em -1em 0 -1em); padding-bottom: .05em; }
  .io .row span { display: inline-block; }
  .io .lime { color: var(--lime); }
  .arrow { width: 160px; height: 200px; margin: 20px 0; overflow: visible; }

  /* ---------- scene 6: end card ---------- */
  .logo { width: 300px; height: 300px; overflow: visible; }
  .endname { margin-top: 50px; font-size: 130px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
  .endname .m { color: var(--lime); }
  .tags { margin-top: 40px; display: flex; gap: 18px; }
  .tag { padding: 16px 30px; border-radius: 999px; border: 3px solid rgba(255,255,255,.25); font-size: 40px; font-weight: 700; }
  .cmd { margin-top: 60px; padding: 26px 40px; border-radius: 22px; background: #1c1a26; font-size: 46px; color: #e8e6f0; border: 2px solid rgba(200,255,61,.4); }
  .cmd .p { color: var(--lime); }
  .logowrap { position: relative; width: 300px; height: 300px; }
  .ring { position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; translate: -50% -50%; border-radius: 50%;
    border: 4px solid rgba(200,255,61,.5); }
</style>
</head>
<body>
  <audio id="music" src="assets/music.m4a" data-volume="0.8" data-fade-out="0.8"></audio>

  <!-- always-on background -->
  <div class="scene" id="bg">
    <gm-include src="../../blocks/gradient-bg.html" c1="#3a1f8f" c2="#0f3d52" c3="#5a1640" base="#0d0c14" speed="2.2" grain="0.08"></gm-include>
  </div>
  <div id="flash"></div>

  <main data-sequence data-cuts="0 1.592 3.199 4.806 6.948 8.555" data-cut-align="middle">

    <!-- 1: MAKE THIS WHOLE VIDEO -->
    <section class="scene" id="s1">
      <div class="vf"><b></b><b></b><b></b><b></b></div>
      <div class="rec">REC</div>
      <div class="tc mono" id="tc">00:00:00</div>
      <div class="stage" style="top: 300px" data-camera="push 1.06">
        <div class="kicker"><span id="w-you">YOU</span> <span id="w-can">CAN</span></div>
        <div class="stack">
          <span class="ln" data-fit="grow"><span class="w" id="w-make">MAKE</span> <span class="w" id="w-this">THIS</span></span>
          <span class="ln" data-fit="grow"><span class="w" id="w-whole">WHOLE</span></span>
          <span class="ln accent" data-fit="grow"><span class="w" id="w-video">VIDEO</span></span>
        </div>
      </div>
    </section>

    <!-- 2: WITH ONE HTML FILE -->
    <section class="scene" id="s2" data-transition="whip-up 0.3">
      <svg class="burst" viewBox="-900 -900 1800 1800"><path id="rays" fill="#2a1f5c"/></svg>
      <svg id="pop" viewBox="-540 -540 1080 1080"><circle id="shock" r="330"/><g id="rays2"></g></svg>
      <div class="stage" data-camera="push 1.06, handheld 4">
        <div class="file" id="file">
          <svg viewBox="0 0 470 590">
            <path d="M40 0 H330 L470 140 V550 Q470 590 430 590 H40 Q0 590 0 550 V40 Q0 0 40 0 Z" fill="#c8ff3d"/>
            <path d="M330 0 V110 Q330 140 360 140 H470 Z" fill="#9ccc1f"/>
          </svg>
          <div class="glyph" id="glyph">&lt;/&gt;</div>
          <div class="ext mono" id="ext">video.html</div>
        </div>
        <div class="onefile"><span id="w-one">ONE</span> <span class="accent" id="w-file">FILE.</span></div>
      </div>
    </section>

    <!-- 3: YOUR AI WRITES THE CODE -->
    <section class="scene" id="s3" data-transition="zoom-through 0.35">
      <div class="stage" data-camera="push 1.07">
        <div class="aihead">
          <svg class="spark" viewBox="-60 -60 120 120"><path id="star" fill="#c8ff3d"/></svg>
          <span class="ai" id="w-ai">AI</span><span id="w-writes">WRITES</span>
        </div>
        <div class="codewrap">
          <gm-include src="../../blocks/code-window.html" title="video.html" lang="html" typing="150" delay="0.15" width="960" size="44">
<section class="scene">
  <h1 data-enter="pop">
    Make this video
  </h1>
</section></gm-include>
        </div>
      </div>
    </section>

    <!-- 4: GIVEMOTION RENDERS EVERY FRAME -->
    <section class="scene" id="s4" data-transition="push-left 0.3">
      <div class="stage">
        <div class="brand" id="brand"><span class="m">give</span>motion</div>
        <div class="strip" data-check="crop-ok">
          <div class="film" id="film">
            <div class="fr">MAKE</div><div class="fr">THIS</div><div class="fr">1</div><div class="fr">&lt;/&gt;</div>
            <div class="fr">AI</div><div class="fr">CODE</div><div class="fr">▶</div><div class="fr">GO</div>
            <div class="fr">MAKE</div><div class="fr">THIS</div><div class="fr">1</div><div class="fr">&lt;/&gt;</div>
            <div class="fr">AI</div><div class="fr">CODE</div><div class="fr">▶</div><div class="fr">GO</div>
            <div class="fr">MAKE</div><div class="fr">THIS</div><div class="fr">1</div><div class="fr">&lt;/&gt;</div>
            <div class="fr">AI</div><div class="fr">CODE</div><div class="fr">▶</div><div class="fr">GO</div>
          </div>
        </div>
        <div class="counter mono"><span class="lbl">FRAME</span><span class="n" id="count">000</span><span class="lbl">/ 330</span></div>
      </div>
    </section>

    <!-- 5: HTML IN. VIDEO OUT. -->
    <section class="scene" id="s5" data-transition="whip-left 0.3">
      <div class="stage" data-camera="push 1.06">
        <div class="io">
          <span class="row"><span id="io1">HTML IN.</span></span>
          <svg class="arrow" viewBox="0 0 160 200"><path id="arrow" d="M80 0 V180 M20 120 L80 185 L140 120" fill="none" stroke="#c8ff3d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
          <span class="row"><span class="lime" id="io2">VIDEO OUT.</span></span>
        </div>
      </div>
    </section>

    <!-- 6: END CARD -->
    <section class="scene" id="s6" data-transition="iris 0.4">
      <div class="stage" data-camera="float 10">
        <div class="logowrap"><div class="ring" id="ring"></div>
        <svg class="logo" id="logo" viewBox="-150 -150 300 300">
          <path id="lg-l" d="M-70 -80 L-140 0 L-70 80" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
          <path id="lg-r" d="M70 -80 L140 0 L70 80" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
          <path id="lg-play" d="M-38 -62 L62 0 L-38 62 Z" fill="#c8ff3d" stroke="#c8ff3d" stroke-width="14" stroke-linejoin="round"/>
        </svg></div>
        <div class="endname" id="endname"><span class="m">give</span>motion</div>
        <div class="tags"><span class="tag" id="t1">open source</span><span class="tag" id="t2">MIT</span><span class="tag" id="t3">AI-first</span></div>
        <div class="cmd mono" id="cmd"><span class="p">$</span> npx givemotion init</div>
      </div>
    </section>
  </main>

  <!-- always-on overlays -->
  <gm-include src="../../blocks/captions.html" file="assets/captions.json" words="3" size="76" accent="#c8ff3d" position="bottom"></gm-include>
  <div id="progress"><i id="bar"></i></div>

<script>
  const music = gm.audio('#music');
  const bar = document.getElementById('bar');
  const tc = document.getElementById('tc');
  const root = document.documentElement;

  gm.onFrame((t) => {
    bar.style.transform = `scaleX(${t / gm.duration})`;
    root.style.setProperty('--beat', music.beat(t, 0.3).toFixed(3));
    const f = Math.floor(t * 30);
    tc.textContent = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`;
  });

  // ---------- scene 1 (global times = voice) ----------
  gm.timeline('#s1', { global: true })
    .from('.vf b', { scale: 1.35, duration: 0.35, ease: 'expo.out', stagger: 0.04 }, 0)
    .from('.rec, .tc', { y: -20, duration: 0.3 }, 0)
    .from(".kicker", { scale: 1.25, rotate: 6, duration: 0.4, ease: 'back.out(2)' }, 0.0)
    .from('#w-make', { yPercent: 130, duration: 0.3, ease: 'expo.out' }, 0.40)
    .from('#w-this', { yPercent: 130, duration: 0.3, ease: 'expo.out' }, 0.64)
    .from('#w-whole', { yPercent: 130, duration: 0.3, ease: 'expo.out' }, 0.86)
    .from('#w-video', { yPercent: 130, scale: 1.3, duration: 0.35, ease: 'back.out(2)' }, 1.12)
    .to('.stack', { rotate: -3, duration: 0.4, ease: 'expo.out' }, 1.12);

  // ---------- scene 2 ----------
  gm.timeline('#s2', { global: true })
    .from('#file', { y: -900, rotate: -14, duration: 0.45, ease: 'back.out(1.4)' }, 1.5)
    .from('#glyph', { scale: 0, rotate: -30, duration: 0.35, ease: 'back.out(2.5)' }, 1.92)
    .from('#ext', { scale: 0, duration: 0.3, ease: 'back.out(2)' }, 2.0)
    .from('#w-one', { y: 160, opacity: 0, duration: 0.3, ease: 'expo.out' }, 1.70)
    .from('#w-file', { y: 160, opacity: 0, duration: 0.3, ease: 'expo.out' }, 2.40)
    .to('#file', { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out' }, 2.40);
  const rays = document.getElementById('rays');
  rays.setAttribute('d', gm.shape.star(18, 900, 120));
  gm.onFrame('#s2', (t) => { rays.parentNode.style.rotate = `${t * 25}deg`; });
  // impact on "file.": shockwave ring + 12 rays shooting out from behind the file
  const pop = document.getElementById('pop');
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * Math.PI * 2, l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', Math.cos(a) * 330); l.setAttribute('y1', Math.sin(a) * 330);
    l.setAttribute('x2', Math.cos(a) * 470); l.setAttribute('y2', Math.sin(a) * 470);
    l.setAttribute('class', 'ray'); document.getElementById('rays2').appendChild(l);
  }
  gm.timeline('#s2', { global: true })
    .set('#pop', { opacity: 0 }, 0)
    .set('#pop', { opacity: 1 }, 2.40)
    .fromTo('#rays2', { scale: 0.7 }, { scale: 1.2, duration: 0.45, ease: 'expo.out', immediateRender: false }, 2.40)
    .to('#rays2', { opacity: 0, duration: 0.25, ease: 'power2.in' }, 2.62)
    .fromTo('#shock', { scale: 0.6, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: 'expo.out', immediateRender: false }, 2.40);

  // ---------- scene 3 ----------
  const star = document.getElementById('star');
  gm.onFrame('#s3', (t) => { star.setAttribute('d', gm.shape.star(4, 58, 16)); star.parentNode.style.rotate = `${t * 140}deg`; });
  gm.timeline('#s3', { global: true })
    .from('.spark', { scale: 0, duration: 0.35, ease: 'back.out(2)' }, 3.2)
    .from('#w-ai', { scale: 0, rotate: -12, duration: 0.3, ease: 'back.out(2.2)' }, 3.38)
    .from('#w-writes', { x: 120, opacity: 0, duration: 0.3, ease: 'expo.out' }, 3.68);

  // ---------- scene 4 ----------
  gm.timeline('#s4', { global: true })
    .from('#brand', { scale: 1.6, opacity: 0, filter: 'blur(20px)', duration: 0.35, ease: 'expo.out' }, 4.78)
    .fromTo('#film', { x: 0 }, { x: -4300, duration: 2.2, ease: 'power2.in' }, 4.75)
    ;
  const count = document.getElementById('count');
  gm.onFrame('#s4', (lt, info) => {
    const n = Math.round(gm.interpolate(info.time, [5.3, 6.85], [0, 330], { easing: 'in-quad' }));
    count.textContent = String(n).padStart(3, '0');
  });

  // ---------- scene 5 ----------
  gm.timeline('#s5', { global: true })
    .from('#io1', { yPercent: 110, duration: 0.35, ease: 'expo.out' }, 6.95)
    .fromTo('#arrow', { draw: 0 }, { draw: 1, duration: 0.35, ease: 'power2.out' }, 7.25)
    .from('#io2', { yPercent: 110, duration: 0.35, ease: 'expo.out' }, 7.48)
    .to('#io2', { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1 }, 8.02);

  // ---------- scene 6 ----------
  gm.timeline('#s6', { global: true })
    .fromTo('#lg-l, #lg-r', { draw: 0 }, { draw: 1, duration: 0.45, ease: 'power3.out' }, 8.6)
    .from('#lg-play', { scale: 0, rotate: -90, duration: 0.45, ease: 'back.out(2)' }, 8.75)
    .from('#endname', { y: 80, opacity: 0, duration: 0.45, ease: 'expo.out' }, 9.0)
    .from('.tag', { scale: 0, duration: 0.35, ease: 'back.out(2)', stagger: 0.08 }, 9.35)
    .from('#cmd', { y: 60, opacity: 0, duration: 0.4, ease: 'expo.out' }, 9.7)
    .to('#endname', { scale: 1.08, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out' }, 10.698);
  const ring = document.getElementById('ring'), logo = document.getElementById('logo');
  gm.onFrame('#s6', (lt, info) => {
    const b = music.beat(info.time ?? lt, 0.4);
    ring.style.scale = 1 + b * 0.18;
    ring.style.opacity = 0.25 + b * 0.75;
    logo.style.scale = 1 + b * 0.06;
  });
</script>
</body>
</html>
