<!doctype html>
<!-- Product promo for a fictional app. Shows: sequences + transitions, blocks, typing, SVG line drawing,
     a cursor with clicks, counters, a music bed. Render: npx motionwright render examples/product-promo/index.html -o out/promo.mp4 -->
<html data-width="1920" data-height="1080" data-fps="30">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #8ea2ff; --mint: #5eead4; --ink: #0a0c12; }
  body { background: var(--ink); color: #f3f5fa; font-family: Inter, "SF Pro Display", system-ui, sans-serif; }
  .scene { display: grid; place-items: center; }
  .front { position: relative; z-index: 1; }

  /* ---- Scene 3: the builder UI ---- */
  .app { position: relative; z-index: 1; width: 1500px; height: 820px; border-radius: 28px; background: #0f121a; border: 1px solid #ffffff14;
         box-shadow: 0 60px 140px #0009; overflow: hidden; }
  .app__top { height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 1px solid #ffffff0f; color: #8d95a8; font-size: 24px; }
  .app__top b { color: #fff; font-weight: 700; margin-right: auto; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #ff5f57; } .dot:nth-child(2){background:#febc2e} .dot:nth-child(3){background:#28c840}
  .prompt { position: absolute; left: 60px; right: 60px; top: 112px; height: 96px; border-radius: 22px; background: #161a24; border: 2px solid #8ea2ff55;
            display: flex; align-items: center; padding: 0 30px; gap: 20px; font-size: 34px; color: #e9ecf5; }
  .prompt .spark { font-size: 36px; }
  .run { margin-left: auto; padding: 16px 32px; border-radius: 14px; background: var(--accent); color: #0b0d12; font-weight: 800; font-size: 28px; flex: none; }
  .run[data-mw-hover] { filter: brightness(1.15); }
  .canvas { position: absolute; left: 0; right: 0; top: 240px; bottom: 0; }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wire { fill: none; stroke: #8ea2ff; stroke-width: 4; stroke-dasharray: 1 1; }
  .node { position: absolute; width: 270px; padding: 26px; border-radius: 22px; background: #171b26; border: 1px solid #ffffff1a;
          box-shadow: 0 20px 50px #0007; display: flex; flex-direction: column; gap: 10px; }
  .node i { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-size: 30px; }
  .node b { font-size: 30px; } .node span { font-size: 22px; color: #8d95a8; }
  .ok { position: absolute; right: 60px; bottom: 50px; display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 16px;
        background: #12261d; border: 1px solid #4ade8055; color: #86efac; font-size: 28px; font-weight: 700; }

  /* ---- Scene 4: numbers ---- */
  .nums { position: relative; z-index: 1; display: flex; gap: 140px; }
  .num { text-align: center; }
  .num .v { font-size: 170px; font-weight: 800; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg,#fff 20%,#a9b7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num .l { font-size: 40px; color: #aab2c5; margin-top: 18px; }
</style>
</head>
<body>
<audio src="assets/music.m4a" data-volume="0.55" data-fade-out="1.5"></audio>

<main data-sequence>
  <!-- 1. Logo -->
  <section class="scene" data-duration="3.2">
    <mw-include src="../../blocks/gradient-bg.html" c1="#3b4bd8" c2="#0ea5a4" c3="#7c3aed"></mw-include>
    <mw-include src="../../blocks/logo-reveal.html" logo="assets/logo.svg" tagline="Automations that build themselves" size="150"></mw-include>
  </section>

  <!-- 2. Headline -->
  <section class="scene" data-duration="3.4" data-transition="blur 0.7">
    <mw-include src="../../blocks/grid-bg.html" glow="#5b6cff"></mw-include>
    <mw-include src="../../blocks/title-card.html" kicker="Introducing Flowline AI" title="Describe it. We build the workflow." accent="#8ea2ff"></mw-include>
  </section>

  <!-- 3. Product demo -->
  <section class="scene" data-duration="7.2" data-transition="slide-left 0.8 in-out-cubic">
    <mw-include src="../../blocks/grid-bg.html" glow="#3b82f6" pattern="dots"></mw-include>
    <div class="app" data-enter="rise 0.8">
      <div class="app__top"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;&nbsp;<b>Flowline</b> Workflows › New</div>
      <div class="prompt"><span class="spark">✨</span><span data-type="34" data-type-delay="0.6" data-type-caret>When a new lead signs up, enrich it and post to Slack</span><div class="run" id="run">Build</div></div>
      <div class="canvas" data-start="2.9">
        <svg viewBox="0 0 1500 580">
          <path class="wire" pathLength="1" d="M330 210 C 390 210, 400 210, 460 210" style="animation: draw .35s var(--ease-out-cubic) .25s both"/>
          <path class="wire" pathLength="1" d="M730 210 C 790 210, 800 210, 860 210" style="animation: draw .35s var(--ease-out-cubic) .55s both"/>
          <path class="wire" pathLength="1" d="M1130 210 C 1190 210, 1200 210, 1260 210" style="animation: draw .35s var(--ease-out-cubic) .85s both"/>
        </svg>
        <div class="node" style="left:60px;top:110px" data-enter="pop 0.5 0"><i style="background:#fde68a33">📝</i><b>New signup</b><span>Form trigger</span></div>
        <div class="node" style="left:460px;top:110px" data-enter="pop 0.5 0.3"><i style="background:#a5b4fc33">🔎</i><b>Enrich lead</b><span>Company + role</span></div>
        <div class="node" style="left:860px;top:110px" data-enter="pop 0.5 0.6"><i style="background:#5eead433">🤖</i><b>AI summary</b><span>3 bullet points</span></div>
        <div class="node" style="left:1260px;top:110px;width:200px" data-enter="pop 0.5 0.9"><i style="background:#f0abfc33">💬</i><b>Slack</b><span>#sales</span></div>
        <div class="ok" data-start="2.2" data-enter="fade-up 0.5">✓ Workflow live · first run in 1.2s</div>
      </div>
    </div>
    <mw-include src="../../blocks/cursor.html" points="1500,980 #run! 1500,840" times="0.3 2.5 5.4"></mw-include>
  </section>

  <!-- 4. Numbers -->
  <section class="scene" data-duration="3.6" data-transition="zoom 0.6">
    <mw-include src="../../blocks/gradient-bg.html" c1="#1e3a8a" c2="#0f766e" c3="#4c1d95"></mw-include>
    <div class="nums">
      <div class="num" data-enter="fade-up 0.6"><div class="v" data-count="0 12" data-count-suffix="h"></div><div class="l">saved per week</div></div>
      <div class="num" data-enter="fade-up 0.6 0.15"><div class="v" data-count="0 4.8" data-count-decimals="1" data-count-suffix="×"></div><div class="l">faster to ship</div></div>
      <div class="num" data-enter="fade-up 0.6 0.3"><div class="v" data-count="0 300" data-count-suffix="+"></div><div class="l">integrations</div></div>
    </div>
  </section>

  <!-- 5. Quote -->
  <section class="scene" data-duration="4.2" data-transition="fade 0.6">
    <mw-include src="../../blocks/grid-bg.html" glow="#7c3aed"></mw-include>
    <mw-include src="../../blocks/quote.html" text="We replaced three tools and a weekly meeting with one prompt." author="Maya Chen" role="Ops Lead, Northwind (fictional)" accent="#8ea2ff"></mw-include>
  </section>

  <!-- 6. End card -->
  <section class="scene" data-duration="4" data-transition="iris 0.8">
    <mw-include src="../../blocks/gradient-bg.html"></mw-include>
    <mw-include src="../../blocks/end-card.html" logo="assets/logo.svg" title="Build your first flow in a minute" cta="Start free" url="flowline.example"></mw-include>
  </section>
</main>

</body>
</html>
