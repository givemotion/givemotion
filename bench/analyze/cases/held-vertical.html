<!doctype html>
<!-- analyze benchmark (HELD OUT, not used for tuning): a vertical short, shared dark background, large colored panels,
     camera drift in the scenes. push-left, cut, whip-up, dip, wipe-down, zoom. -->
<html data-width="720" data-height="1280" data-fps="30">
<head>
<style>
  body { margin: 0; background: #0e0e12; color: #fff; font-family: Inter, system-ui, sans-serif; }
  .scene { overflow: hidden; }
  .panel { position: absolute; left: 60px; right: 60px; border-radius: 40px; }
  h1 { position: absolute; margin: 0; left: 60px; right: 60px; text-align: center; font-size: 100px; font-weight: 900; letter-spacing: -0.04em; line-height: .95; text-transform: uppercase; }
  p { position: absolute; margin: 0; left: 60px; right: 60px; text-align: center; font-size: 34px; font-weight: 600; opacity: .85; }
  .ball { position: absolute; border-radius: 50%; }
</style>
</head>
<body>
<main data-sequence>
  <section class="scene" data-duration="2.2" data-camera="push 1.06">
    <div class="panel" style="top:240px;height:620px;background:#ff5d8f" data-enter="scale 0.5 0.1"></div>
    <h1 style="top:420px" data-enter="fade-up 0.5 0.3">Swipe<br>up</h1>
    <p style="top:960px" data-enter="fade 0.4 0.6">part one of six</p>
  </section>
  <section class="scene" data-duration="2.2" data-transition="push-left 0.4" data-camera="float 14">
    <div class="ball" style="left:110px;top:260px;width:500px;height:500px;background:#3a86ff" data-enter="pop 0.5 0.2"></div>
    <h1 style="top:860px" data-enter="fade-up 0.5 0.4">Round</h1>
  </section>
  <section class="scene" data-duration="2.2" data-camera="push 1.08">
    <div class="panel" style="top:160px;height:420px;background:#ffbe0b" data-enter="fade 0.4 0.1"></div>
    <div class="panel" style="top:640px;height:420px;background:#fb5607" data-enter="fade 0.4 0.3"></div>
    <h1 style="top:300px;color:#111" data-enter="fade-down 0.4 0.4">Two</h1>
  </section>
  <section class="scene" data-duration="2.2" data-transition="whip-up 0.3" data-camera="float 14">
    <h1 style="top:200px" data-enter="fade-up 0.4 0.3">Quick</h1>
    <div class="panel" style="top:420px;height:700px;background:#8338ec" data-enter="scale 0.4 0.2"></div>
  </section>
  <section class="scene" data-duration="2.2" data-transition="dip 0.6">
    <div class="ball" style="left:160px;top:380px;width:400px;height:400px;border:30px solid #06d6a0;box-sizing:border-box" data-enter="pop 0.5 0.3"></div>
    <h1 style="top:900px" data-enter="fade-up 0.4 0.5">Breathe</h1>
  </section>
  <section class="scene" data-duration="2.2" data-transition="wipe-down 0.5" style="background:#f1faee;color:#1d3557">
    <h1 style="top:300px" data-enter="fade-up 0.4 0.3">Light<br>mode</h1>
    <div class="panel" style="top:700px;height:300px;background:#1d3557" data-enter="grow-x 0.5 0.4"></div>
  </section>
  <section class="scene" data-duration="3" data-transition="zoom 0.5">
    <h1 style="top:520px" data-enter="pop 0.5 0.3">Follow</h1>
    <div class="ball" style="left:300px;top:760px;width:120px;height:120px;background:#ff006e"></div>
  </section>
</main>
</body>
</html>
