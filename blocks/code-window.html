<!-- block:
description: Editor window with syntax highlighting and an optional typing effect. Put the code between the tags as plain text (no escaping needed).
params: title (file name), lang (js|ts|py|bash|json|html|css|go|rust), typing (chars per second, 0 = no typing), delay (seconds before typing), width (px at 1080p, default 1200), size (font px, default 34)
usage: <mw-include src="blocks/code-window.html" title="app.ts" lang="ts" typing="40" data-duration="6">const answer = await ai.run(prompt);</mw-include>
-->
<div class="mwb-code" style="--w:{{width|1200}};--fs:{{size|34}}" data-enter="scale 0.7 0 out-expo">
  <div class="mwb-code__bar"><i></i><i></i><i></i><span>{{title}}</span></div>
  <textarea hidden class="mwb-code__src">{{content}}</textarea>
  <pre class="mwb-code__pre"><code data-lang="{{lang|js}}" data-typing="{{typing|0}}" data-delay="{{delay|0.4}}"></code></pre>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const code = root.querySelector('code');
  const lang = code.dataset.lang.toLowerCase();
  // Dedent and trim
  let lines = root.querySelector('.mwb-code__src').value.replace(/\t/g, '  ').split('\n');
  while (lines.length && !lines[0].trim()) lines.shift();
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  const ind = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
  const src = lines.map((l) => l.slice(isFinite(ind) ? ind : 0)).join('\n');
  const KW = {
    js: 'await|async|break|case|catch|class|const|continue|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|of|return|static|super|switch|this|throw|try|typeof|var|void|while|yield|true|false|null|undefined',
    py: 'and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield|self|print',
    bash: 'if|then|else|elif|fi|for|in|do|done|while|case|esac|function|return|export|local|echo|cd|npm|npx|git|sudo|curl|brew|pip|node',
    go: 'break|case|chan|const|continue|default|defer|else|fallthrough|for|func|go|goto|if|import|interface|map|package|range|return|select|struct|switch|type|var|nil|true|false',
    rust: 'as|async|await|break|const|continue|crate|else|enum|extern|false|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|true|type|unsafe|use|where|while',
    css: '',
  };
  KW.ts = KW.js + '|interface|type|enum|implements|private|public|readonly|as|keyof|namespace|declare|abstract';
  KW.jsx = KW.js; KW.tsx = KW.ts; KW.sh = KW.bash; KW.python = KW.py;
  const kw = KW[lang] ?? KW.js;
  const comment = /^(py|python|bash|sh)$/.test(lang) ? '#[^\\n]*' : lang === 'html' ? '<!--[\\s\\S]*?-->' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const parts = [
    ['c', comment],
    ['s', '`(?:\\\\.|[^`])*`|"(?:\\\\.|[^"\\n])*"|\'(?:\\\\.|[^\'\\n])*\''],
    ...(lang === 'html' ? [['t', '<\\/?[A-Za-z][\\w-]*'], ['a', '\\b[\\w-]+(?==)']] : []),
    ...(lang === 'css' ? [['a', '[\\w-]+(?=\\s*:)'], ['n', '#[0-9a-fA-F]{3,8}\\b']] : []),
    ['n', '\\b\\d[\\d_]*(?:\\.\\d+)?(?:e[+-]?\\d+)?\\b'],
    ...(kw ? [['k', '\\b(?:' + kw + ')\\b']] : []),
    ['f', '\\b[A-Za-z_$][\\w$]*(?=\\s*\\()'],
    ['y', '\\b[A-Z][A-Za-z0-9_]*\\b'],
    ['p', '=>|[{}()[\\];,.:=+\\-*/<>!&|?%]'],
  ];
  const re = new RegExp(parts.map((p) => '(' + p[1] + ')').join('|'), 'g');
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let html = '', last = 0, m;
  if (lang === 'json') {
    html = esc(src).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?)/g, (x, s, colon, b, n) => s ? (colon ? `<span class="a">${s}</span>${colon}` : `<span class="s">${s}</span>`) : b ? `<span class="k">${b}</span>` : `<span class="n">${n}</span>`);
  } else {
    while ((m = re.exec(src))) {
      html += esc(src.slice(last, m.index));
      const gi = m.slice(1).findIndex((g) => g !== undefined);
      html += `<span class="${parts[gi][0]}">${esc(m[0])}</span>`;
      last = re.lastIndex;
      if (m[0] === '') re.lastIndex++;
    }
    html += esc(src.slice(last));
  }
  code.innerHTML = html;
  // Shrink the font if the longest line would not fit the window.
  mw.wait(document.fonts.ready.then(() => {
    const pre = root.querySelector('pre');
    if (pre.scrollWidth > pre.clientWidth + 1) {
      const fs = parseFloat(getComputedStyle(pre).fontSize);
      const inner = pre.clientWidth - parseFloat(getComputedStyle(pre).paddingLeft) * 2;
      const need = pre.scrollWidth - parseFloat(getComputedStyle(pre).paddingLeft) * 2;
      pre.style.fontSize = Math.floor(fs * (inner / need) * 0.98) + 'px';
    }
    pre.style.minHeight = pre.offsetHeight + 'px'; // keep the window size fixed while typing
  }));
  const cps = parseFloat(code.dataset.typing);
  if (cps > 0) { code.setAttribute('data-type', String(cps)); code.setAttribute('data-type-delay', code.dataset.delay); code.setAttribute('data-type-caret', ''); }
})();
</script>
<style>
.mwb-code{position:relative;width:calc(var(--px)*var(--w));max-width:calc(var(--stage-w,1920px) - var(--px)*120);border-radius:calc(var(--px)*22);overflow:hidden;background:#0d1117;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 calc(var(--px)*40) calc(var(--px)*120) rgba(0,0,0,.45);text-align:left}
.mwb-code__bar{display:flex;align-items:center;gap:calc(var(--px)*12);height:calc(var(--px)*64);padding:0 calc(var(--px)*24);background:#161b22;border-bottom:1px solid rgba(255,255,255,.06)}
.mwb-code__bar i{width:calc(var(--px)*16);height:calc(var(--px)*16);border-radius:50%;background:#ff5f57}
.mwb-code__bar i:nth-child(2){background:#febc2e} .mwb-code__bar i:nth-child(3){background:#28c840}
.mwb-code__bar span{flex:1;text-align:center;margin-right:calc(var(--px)*72);color:#8b949e;font:500 calc(var(--px)*24)/1 Inter,system-ui,sans-serif}
.mwb-code__pre{margin:0;padding:calc(var(--px)*36) calc(var(--px)*44);font:calc(var(--px)*var(--fs))/1.55 "JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;color:#e6edf3;white-space:pre;tab-size:2}
.mwb-code .c{color:#8b949e;font-style:italic} .mwb-code .s{color:#a5d6ff} .mwb-code .n{color:#79c0ff} .mwb-code .k{color:#ff7b72}
.mwb-code .f{color:#d2a8ff} .mwb-code .y{color:#ffa657} .mwb-code .p{color:#c9d1d9} .mwb-code .t{color:#7ee787} .mwb-code .a{color:#79c0ff}
.mwb-code .mw-caret{background:#58a6ff}
</style>
