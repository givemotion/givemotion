<!-- block:
description: Label with a hand-drawn style arrow pointing at a spot, plus a pulsing ring on the target. Coordinates are px in a 1080p frame.
params: x, y (target point), label, side (where the label sits: left|right|top|bottom, default right), distance (px, default 260), accent (color)
usage: <gm-include src="blocks/callout.html" x="980" y="420" label="Click Deploy" side="right" data-start="1" data-duration="3"></gm-include>
-->
<div class="gmb-call" style="--accent:{{accent|#ffd23f}}" data-x="{{x|960}}" data-y="{{y|540}}" data-side="{{side|right}}" data-dist="{{distance|260}}">
  <div class="gmb-call__ring"></div>
  <svg class="gmb-call__svg"><path class="gmb-call__path" pathLength="1"/><path class="gmb-call__head" pathLength="1"/></svg>
  <div class="gmb-call__label" data-enter="pop 0.5 0.55">{{label|Look here}}</div>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const S = gm.px;
  const x = +root.dataset.x * S, y = +root.dataset.y * S, d = +root.dataset.dist * S, side = root.dataset.side;
  const dir = { right: [1, -0.35], left: [-1, -0.35], top: [0.25, -1], bottom: [0.25, 1] }[side] || [1, -0.35];
  const n = Math.hypot(dir[0], dir[1]);
  const lx = x + (dir[0] / n) * d, ly = y + (dir[1] / n) * d;
  const ring = root.querySelector('.gmb-call__ring');
  ring.style.left = x + 'px'; ring.style.top = y + 'px';
  const label = root.querySelector('.gmb-call__label');
  label.style.left = lx + 'px'; label.style.top = ly + 'px';
  label.style.translate = side === 'left' ? '-100% -50%' : side === 'top' ? '-50% -100%' : side === 'bottom' ? '-50% 0' : '0 -50%';
  const svg = root.querySelector('svg');
  const draw = (lx2, ly2) => {
    // arrow from the label edge to near the target, slightly curved
    const vx = x - lx2, vy = y - ly2, len = Math.hypot(vx, vy) || 1, ux = vx / len, uy = vy / len;
    const sx = lx2 + ux * 24 * S, sy = ly2 + uy * 24 * S;
    const ex = x - ux * 46 * S, ey = y - uy * 46 * S;
    const cx = (sx + ex) / 2 + uy * 50 * S, cy = (sy + ey) / 2 - ux * 50 * S;
    const ang = Math.atan2(ey - cy, ex - cx), h = 22 * S;
    const p = (a) => `${ex - Math.cos(ang + a) * h},${ey - Math.sin(ang + a) * h}`;
    svg.querySelector('.gmb-call__path').setAttribute('d', `M${sx},${sy} Q${cx},${cy} ${ex},${ey}`);
    svg.querySelector('.gmb-call__head').setAttribute('d', `M${p(0.5)} L${ex},${ey} L${p(-0.5)}`);
  };
  draw(lx, ly);
  // Keep the label inside the frame (and re-aim the arrow).
  gm.wait(document.fonts.ready.then(() => {
    const r = label.getBoundingClientRect(), m = 40 * S;
    let dx = 0, dy = 0;
    if (r.right > gm.width - m) dx = gm.width - m - r.right; else if (r.left < m) dx = m - r.left;
    if (r.bottom > gm.height - m) dy = gm.height - m - r.bottom; else if (r.top < m) dy = m - r.top;
    if (dx || dy) { label.style.left = (lx + dx) + 'px'; label.style.top = (ly + dy) + 'px'; draw(lx + dx, ly + dy); }
  }));
})();
</script>
<style>
.gmb-call{position:absolute;inset:0;pointer-events:none;z-index:40}
.gmb-call__svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gmb-call__path,.gmb-call__head{fill:none;stroke:var(--accent);stroke-width:calc(var(--px)*6);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;filter:drop-shadow(0 calc(var(--px)*3) calc(var(--px)*6) rgba(0,0,0,.35))}
.gmb-call__path{animation:draw .55s var(--ease-in-out-cubic) .15s both}
.gmb-call__head{animation:draw .25s var(--ease-out-cubic) .65s both}
.gmb-call__ring{position:absolute;width:calc(var(--px)*72);height:calc(var(--px)*72);margin:calc(var(--px)*-36) 0 0 calc(var(--px)*-36);border-radius:50%;border:calc(var(--px)*5) solid var(--accent);
  animation:pop-in .5s var(--ease-out-back) both,gmb-call-pulse 1.4s ease-out .6s infinite}
.gmb-call__label{position:absolute;white-space:nowrap;padding:calc(var(--px)*14) calc(var(--px)*26);border-radius:calc(var(--px)*16);background:var(--accent);color:#111;font-size:calc(var(--px)*40);font-weight:800;box-shadow:0 calc(var(--px)*12) calc(var(--px)*30) rgba(0,0,0,.3)}
@keyframes gmb-call-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent),transparent 30%)}100%{box-shadow:0 0 0 calc(var(--px)*30) transparent}}
</style>
