<!doctype html>
<!-- analyze benchmark (HELD OUT, not used for tuning): shared drifting gradient + moving particles, small content,
     floating camera inside the scenes. whip-right, zoom-through, wipe-left, cut, fade, push-up, iris. -->
<html data-width="1280" data-height="720" data-fps="30">
<head>
<style>
  body { margin: 0; background: #08080f; color: #fff; font-family: Inter, system-ui, sans-serif; }
  main { z-index: 5; }
  .p { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,230,180,.6); animation: rise linear infinite; }
  @keyframes rise { from { translate: 0 0; } to { translate: -120px -760px; } }
  .tag { position: absolute; padding: 14px 26px; border-radius: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.01em; }
  .num { position: absolute; margin: 0; font-size: 120px; font-weight: 900; letter-spacing: -0.04em; }
  .chip { position: absolute; width: 90px; height: 90px; border-radius: 26px; }
  .orbit { position: absolute; width: 40px; height: 40px; border-radius: 50%; animation: orb 1.8s linear infinite; transform-origin: 120px 0; }
  @keyframes orb { to { rotate: 360deg; } }
</style>
</head>
<body>
<div class="scene" id="bg"><gm-include src="../../../blocks/gradient-bg.html" c1="#5b2a86" c2="#1b4965" c3="#9d4edd" base="#08080f" speed="2.5" grain="0.08"></gm-include><div id="parts"></div></div>
<script>
  const parts = document.getElementById('parts');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'p';
    d.style.left = ((i * 173) % 1400) + 'px';
    d.style.top = (720 + ((i * 59) % 300)) + 'px';
    d.style.animationDuration = (4 + (i % 4)) + 's';
    d.style.animationDelay = (-(i % 9) * 0.55) + 's';
    parts.appendChild(d);
  }
</script>
<main data-sequence>
  <section class="scene" data-duration="2.4" data-camera="float 16">
    <span class="tag" style="left:140px;top:180px;background:#ff7b00" data-enter="fade-up 0.5 0.2">Plan</span>
    <h2 class="num" style="left:140px;top:300px" data-enter="fade 0.5 0.5">01</h2>
  </section>
  <section class="scene" data-duration="2.4" data-transition="whip-right 0.3" data-camera="float 16">
    <span class="tag" style="right:160px;top:420px;background:#00b4d8" data-enter="fade-left 0.5 0.3">Build</span>
    <div class="chip" style="left:220px;top:180px;background:#00b4d8"></div><div class="orbit" style="left:300px;top:225px;background:#fff"></div>
  </section>
  <section class="scene" data-duration="2.4" data-transition="zoom-through 0.45">
    <h2 class="num" style="left:520px;top:220px" data-enter="scale 0.5 0.3">03</h2>
    <span class="tag" style="left:500px;top:420px;background:#e5383b" data-enter="fade-up 0.4 0.6">Check</span>
  </section>
  <section class="scene" data-duration="2.4" data-transition="wipe-left 0.5" data-camera="push 1.05">
    <span class="tag" style="left:160px;top:520px;background:#70e000;color:#111" data-enter="fade-up 0.4 0.4">Fix</span>
    <div class="chip" style="right:220px;top:140px;background:#70e000"></div><div class="chip" style="right:340px;top:140px;background:#38b000"></div>
  </section>
  <section class="scene" data-duration="2.4" data-camera="float 16">
    <h2 class="num" style="right:180px;top:120px" data-enter="fade-down 0.4 0.3">05</h2>
    <span class="tag" style="left:180px;top:380px;background:#ffd60a;color:#111" data-enter="pop 0.4 0.4">Again</span>
  </section>
  <section class="scene" data-duration="2.4" data-transition="fade 0.5">
    <span class="tag" style="left:460px;top:160px;background:#f72585" data-enter="fade-up 0.4 0.4">Share</span>
    <div class="orbit" style="left:520px;top:420px;background:#f72585"></div><div class="orbit" style="left:700px;top:420px;background:#4cc9f0;animation-delay:-.9s"></div>
  </section>
  <section class="scene" data-duration="2.4" data-transition="push-up 0.4" data-camera="float 16">
    <h2 class="num" style="left:160px;top:160px" data-enter="fade-right 0.4 0.3">07</h2>
    <span class="tag" style="left:160px;top:360px;background:#7209b7" data-enter="fade 0.4 0.5">Rest</span>
  </section>
  <section class="scene" data-duration="2.1" data-transition="iris 0.5">
    <h2 class="num" style="left:440px;top:250px" data-enter="pop 0.5 0.3">Done</h2>
  </section>
</main>
</body>
</html>
