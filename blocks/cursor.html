<!-- block:
description: A mouse pointer that glides between targets and clicks them. Aim at real elements with CSS selectors (the pointer follows them even while they move, through any camera zoom), or at "x,y" points (px at 1080p, in the box the cursor sits in: inside a gm.camera world that is world px). Add ! to click. Clicked elements get a short press, and the attribute data-gm-pressed while pressed and data-gm-hover while the pointer is over them, so you can style them. Put it inside a camera world (it zooms with the world) or after the world in the scene (it keeps its size and still lands on the targets in the world).
params: points (e.g. "#email #submit! 1500,900"; a selector aims a little below its middle, or where you say after @: "#slot-thu@30%,55%" = 30% across and 55% down its box, "#row@40,50%" = 40 px in from its left edge (px at 1080p, zoomed with it) and halfway down; put the ! last: "#slot-thu@30%,55%!"), aim (default aim point for selector targets without their own @, same form, default "50%,56%"), ring (the click ripple's color, e.g. "#e5484d"; "light" = white; default: a dark ring with a light halo that reads on light and dark UIs, white with <html data-motion="classic">), times (one per point: when the pointer arrives there. Seconds into the clip by default; "video: 12.5 13.4" for video times, "beats: 16 18 20" or "bars: 4 4.5" on the <html data-bpm> grid, or words of the voice-over "@type @send-0.2" with <html data-words>), show (always|auto, default always: from the start of the clip. auto: fades in just before its first move, or just before its first point when that is a click, fades out after its last point, and leaves during a wait of 3 s or more between two points), size (px at 1080p, default 44), style (arrow|hand|auto, default auto: hand over clickable targets)
usage: <gm-include src="blocks/cursor.html" points="1700,980 #run! #canvas .node:nth-child(2)!" times="0.3 1.4 3 4.2" show="auto"></gm-include>
-->
<div class="gmb-cursor" style="--s:{{size|44}}" data-points="{{points|200,800 960,540!}}" data-times="{{times}}" data-show="{{show|always}}" data-style="{{style|auto}}" data-aim="{{aim}}" data-ring="{{ring}}">
  <div class="gmb-cursor__ring"></div>
  <svg class="gmb-cursor__arrow" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6-3.4 6.2z"/></svg>
  <svg class="gmb-cursor__hand" viewBox="0 0 24 24"><path d="M9 3.2c.9 0 1.6.7 1.6 1.6v6.1l.6-.1c.8 0 1.5.6 1.6 1.4l.1.2c.3-.5.8-.8 1.4-.8.8 0 1.5.6 1.6 1.4.3-.3.7-.5 1.2-.5.9 0 1.6.7 1.6 1.6v2.3c0 3.1-2.5 5.6-5.6 5.6h-1.3c-1.9 0-3.6-1-4.6-2.6l-2.9-4.8c-.4-.7-.2-1.6.5-2 .6-.4 1.4-.2 1.9.3l.8 1V4.8c0-.9.7-1.6 1.6-1.6z"/></svg>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const arrow = root.querySelector('.gmb-cursor__arrow'), hand = root.querySelector('.gmb-cursor__hand'), ring = root.querySelector('.gmb-cursor__ring');
  const scope = root.closest('.scene,[data-duration],[data-start]') || document.body;
  // "x,y" or a CSS selector; "!" at the end means click
  // an aim point inside the target's box: "30%,55%" (share of its size) or px at 1080p from its left/top edge ("40,50%")
  const aimOf = (v) => { const m = /^\s*(-?[\d.]+)(%?)\s*,\s*(-?[\d.]+)(%?)\s*$/.exec(v || ''); return m ? [{ v: +m[1], pct: !!m[2] }, { v: +m[3], pct: !!m[4] }] : null; };
  const aim0 = aimOf(root.dataset.aim);
  if ((root.dataset.aim || '').trim() && !aim0) gm.__report('warning', 'cursor-aim', `cursor: aim="${root.dataset.aim}" is not "x,y" (like "30%,55%" or "40,50%").`, root, 'Give two values: percent of the target box (30%) or px at 1080p from its left/top edge (40).');
  const pts = root.dataset.points.trim().split(/\s+(?![^\[]*\])/).map((p) => {
    const click = p.endsWith('!');
    let s = click ? p.slice(0, -1) : p;
    const m = /^(-?[\d.]+),(-?[\d.]+)$/.exec(s);
    if (m) return { x: +m[1], y: +m[2], click };
    const at = /^(.+)@(-?[\d.]+%?,-?[\d.]+%?)$/.exec(s);
    let aim = aim0;
    if (at) { s = at[1]; aim = aimOf(at[2]); }
    return { sel: s, click, el: null, aim };
  });
  // times: seconds into the clip, or words ("@book @send"), or "video: 12.5 13.4" / "beats: 16 18" / "bars: 4 4.5" (then video times)
  const tAttr = (root.dataset.times || '').trim();
  const unit = /^(video|global|beats?|bars?)\s*:/i.exec(tAttr);
  // a word of the voice-over ("@type @send-0.2", with <html data-words>) is a video time; then the whole list is
  const toks = (unit ? tAttr.slice(unit[0].length) : tAttr).trim().split(/[\s,]+/).filter(Boolean);
  const words = toks.some((x) => x[0] === '@');
  const video = !!unit || words;
  let ts = toks.map((x) => (x[0] === '@' ? gm.word(x) : Number(x)));
  if (ts.some((x) => !isFinite(x))) { gm.__report('error', 'cursor-times', `cursor: times="${tAttr}" has something that is not a number.`, root, 'Give one number per point: times="0.4 1.6 3", or times="video: 12.5 13.4" / "beats: 16 18".'); ts = ts.filter((x) => isFinite(x)); }
  if (unit && /^beat/i.test(unit[1])) ts = ts.map((b) => gm.beat(b));
  if (unit && /^bar/i.test(unit[1])) ts = ts.map((b) => gm.bar(b));
  // no times, or fewer than points: 0.3 s in, then 1.2 s apart
  while (ts.length < pts.length) ts.push(ts.length ? ts[ts.length - 1] + 1.2 : 0.3);
  const style = root.dataset.style, show = (root.dataset.show || 'always').trim();
  // show="auto": in just before the first move (or the first point, when that is a click), out after the last point
  const n = pts.length, appear = pts[0].click || n < 2 ? ts[0] : ts[1] - Math.min(ts[1] - ts[0], 0.9);
  const leave = ts[n - 1] + (pts[n - 1].click ? 0.6 : 0.25);
  const targetOf = (p) => { if (!p.sel) return null; if (!p.el || !p.el.isConnected) p.el = scope.querySelector(p.sel) || document.querySelector(p.sel); return p.el; };
  for (const p of pts) if (p.sel && !targetOf(p)) gm.__report('error', 'cursor-target', `cursor: "${p.sel}" matched nothing.`, root, 'Use a selector for an element in the same scene, e.g. #button.');
  // Three invisible points next to the pointer (same containing block): screen <-> the pointer's own coordinates,
  // through any camera zoom, pan or rotation above it
  const probes = [[0, 0], [1000, 0], [0, 1000]].map(([x, y]) => { const d = document.createElement('div'); d.setAttribute('data-gm-internal', ''); d.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:0;height:0;margin:0;pointer-events:none;visibility:hidden`; root.parentElement.insertBefore(d, root); return d; });
  function space() {
    const [o, a, b] = probes.map((d) => d.getBoundingClientRect());
    const ax = (a.left - o.left) / 1000, ay = (a.top - o.top) / 1000, bx = (b.left - o.left) / 1000, by = (b.top - o.top) / 1000, det = ax * by - ay * bx || 1;
    return {
      toLocal: (sx, sy) => { const dx = sx - o.left, dy = sy - o.top; return [(dx * by - dy * bx) / det, (dy * ax - dx * ay) / det]; },
      toScreen: (x, y) => [o.left + x * ax + y * bx, o.top + x * ay + y * by],
    };
  }
  // Where a point is right now, in the pointer's own coordinates (CSS px)
  function where(p, S) {
    const el = targetOf(p);
    if (!el) return { x: (p.x || 0) * gm.px, y: (p.y || 0) * gm.px };
    const r = el.getBoundingClientRect();
    // aim a little below the middle, like a real hand would (or at the point given with @ / aim)
    if (!p.aim) { const [x, y] = S.toLocal(r.left + r.width * 0.5, r.top + r.height * 0.56); return { x, y }; }
    const k = el.offsetWidth ? r.width / el.offsetWidth : 1; // the target's own zoom on screen
    const ax = p.aim[0].pct ? r.width * p.aim[0].v / 100 : p.aim[0].v * gm.px * k, ay = p.aim[1].pct ? r.height * p.aim[1].v / 100 : p.aim[1].v * gm.px * k;
    const [x, y] = S.toLocal(r.left + ax, r.top + ay);
    return { x, y };
  }
  // the click ring: a dark ring with a light halo reads on light and dark screens (classic motion: the old white one)
  const rc = (root.dataset.ring || '').trim(), natural = !gm.__internal || !gm.__internal.naturalMotion || gm.__internal.naturalMotion();
  if (/^(light|white)$/i.test(rc)) { /* the stylesheet's white ring */ }
  else if (rc || natural) {
    const c = rc && !/^dark$/i.test(rc) ? rc : '#16181d';
    ring.style.borderColor = c;
    ring.style.background = `color-mix(in srgb, ${c} 14%, transparent)`;
    ring.style.boxShadow = '0 0 0 calc(var(--px)*3) rgba(255,255,255,.75), inset 0 0 0 calc(var(--px)*2) rgba(255,255,255,.5)';
  }
  const pressed = new Set();
  gm.onLayout(root, (local, info) => {
    const t = video ? info.time : local;
    const S = space();
    let i = 0;
    while (i < n - 1 && t >= ts[i + 1]) i++;
    const P = where(pts[i], S);
    let x = P.x, y = P.y;
    if (i < n - 1 && t > ts[i]) {
      const seg = ts[i + 1] - ts[i], move = Math.min(seg, 0.9);
      const p = gm.interpolate(t, [ts[i + 1] - move, ts[i + 1]], [0, 1], { easing: 'in-out-cubic' });
      if (p > 0) {
        const Q = where(pts[i + 1], S);
        const mx = (P.x + Q.x) / 2, my = Math.min(P.y, Q.y) - 60 * gm.px; // slight arc
        const q = (a, b, c) => (1 - p) * (1 - p) * a + 2 * (1 - p) * p * b + p * p * c;
        x = q(P.x, mx, Q.x); y = q(P.y, my, Q.y);
      }
    }
    let opacity = show === 'auto'
      ? Math.min(gm.interpolate(t, [appear - 0.25, appear], [0, 1]), gm.interpolate(t, [leave, leave + 0.3], [1, 0]))
      : gm.interpolate(local, [0, 0.25], [0, 1]);
    // show="auto" and a long wait between two points (3 s or more): the pointer leaves after the first and comes back
    // just before it sets off for the next, instead of sitting on the screen
    if (show === 'auto') for (let i = 0; i + 1 < n; i++) {
      const a = ts[i] + (pts[i].click ? 0.6 : 0.25), b = ts[i + 1] - 0.9;
      if (b - a < 2.1 || t <= a || t >= b) continue;
      opacity = Math.min(opacity, Math.max(gm.interpolate(t, [a, a + 0.3], [1, 0]), gm.interpolate(t, [b - 0.3, b], [0, 1])));
    }
    // clicks: press + ripple right after arriving at a point marked with !
    let press = 1, rp = -1;
    const nowPressed = new Set();
    pts.forEach((pt, k) => {
      if (!pt.click) return;
      const dt = t - ts[k];
      if (dt >= 0 && dt < 0.6) {
        rp = dt / 0.6;
        const s = Math.sin(Math.min(1, dt / 0.24) * Math.PI);
        press = Math.min(press, 1 - 0.18 * s);
        const el = targetOf(pt);
        if (el && dt < 0.24) { nowPressed.add(el); el.style.scale = String(1 - 0.05 * s); }
      }
    });
    for (const el of pressed) if (!nowPressed.has(el)) { el.style.removeProperty('scale'); el.removeAttribute('data-gm-pressed'); }
    for (const el of nowPressed) el.setAttribute('data-gm-pressed', '');
    pressed.clear(); nowPressed.forEach((e) => pressed.add(e));
    // hover state + hand pointer over targets (not while the pointer is hidden)
    let over = false;
    const [sx, sy] = S.toScreen(x, y);
    for (const pt of pts) {
      const el = targetOf(pt);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      const inside = opacity > 0 && sx >= r.left && sx <= r.right && sy >= r.top && sy <= r.bottom;
      if (inside) { over = true; el.setAttribute('data-gm-hover', ''); } else el.removeAttribute('data-gm-hover');
    }
    // resting on its own target is the point: check should not call the pointer a line through that label
    if (over) root.setAttribute('data-check', 'ignore'); else root.removeAttribute('data-check');
    const useHand = style === 'hand' || (style === 'auto' && over);
    arrow.style.display = useHand ? 'none' : '';
    hand.style.display = useHand ? '' : 'none';
    root.style.translate = `${x}px ${y}px`;
    arrow.style.scale = hand.style.scale = press;
    ring.style.opacity = rp < 0 ? 0 : 1 - rp;
    ring.style.scale = rp < 0 ? 0 : 0.3 + rp * 1.4;
    root.style.opacity = opacity;
  });
})();
</script>
<style>
.gmb-cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:50;pointer-events:none}
.gmb-cursor__arrow,.gmb-cursor__hand{position:absolute;width:calc(var(--px)*var(--s));height:calc(var(--px)*var(--s));filter:drop-shadow(0 calc(var(--px)*4) calc(var(--px)*8) rgba(0,0,0,.4))}
.gmb-cursor__arrow{left:calc(var(--px)*-4);top:calc(var(--px)*-3);transform-origin:15% 10%}
.gmb-cursor__hand{left:calc(var(--px)*var(--s)*-0.37);top:calc(var(--px)*var(--s)*-0.12);transform-origin:37% 12%}
.gmb-cursor svg path{fill:#111;stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.gmb-cursor__ring{position:absolute;width:calc(var(--px)*110);height:calc(var(--px)*110);left:calc(var(--px)*-55);top:calc(var(--px)*-55);border-radius:50%;border:calc(var(--px)*4) solid rgba(255,255,255,.9);background:rgba(255,255,255,.15);opacity:0}
</style>
