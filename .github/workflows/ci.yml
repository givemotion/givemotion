name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  authors:
    # Every commit is the maintainer's: no AI tool as author or committer, no AI co-author trailers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No AI-tool authorship in history
        run: |
          bad=$(git log --format='%h %an <%ae> / %cn <%ce>%n%(trailers:key=Co-authored-by,valueonly)' HEAD \
            | grep -iE 'anthropic|claude' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits authored, committed or co-authored by an AI tool:"
            echo "$bad"
            echo "Set your git identity (git config user.name / user.email) and rewrite these commits before merging."
            exit 1
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      # Ubuntu runners block the user namespaces Chrome's sandbox needs; the runner is already isolated.
      GIVEMOTION_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: node src/cli.js doctor
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
