<!doctype html>
<html data-width="1080" data-height="1920" data-fps="30" data-duration="15">
<head>
<meta charset="utf-8">
<style>
  :root { --cream: #f6e7d2; --roast: #5a3420; --caramel: #e8a25a; }
  body { background: #1a110b; color: var(--cream); font-family: Inter, system-ui, sans-serif; }
  .scene { display: grid; place-items: center; }
  .brand { position: absolute; top: 110px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; z-index: 30; color: var(--cream); text-shadow: 0 2px 12px #0008; }

  /* Scene 2: cup */
  .cupwrap { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: -560px; }
  .cupwrap svg { width: 560px; height: 665px; overflow: visible; }
  .headline { max-width: 900px; text-shadow: 0 4px 24px #0009; font-size: 96px; font-weight: 900; letter-spacing: -.04em; line-height: .98; text-align: center; margin: 0; }
  .headline .accent { color: #ffcf8a; }

  /* Scene 3: price */
  .price { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: -220px; }
  .price .tag { font-size: 300px; font-weight: 900; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; color: #fff6ea; text-shadow: 0 10px 40px #2a1408cc; }
  .price .what { color: #ffcf8a; text-shadow: 0 6px 30px #2a1408cc; font-size: 110px; font-weight: 800; letter-spacing: -.03em; text-transform: uppercase; }
  .price .kicker { font-size: 44px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 4px 20px #000a; }

  /* Scene 4: end */
  .end { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 40px; margin-top: -240px; text-align: center; }
  .end img { width: 300px; height: 300px; }
  .end h1 { font-size: 150px; font-weight: 900; letter-spacing: -.05em; margin: 0; line-height: 1; }
  .end p { font-size: 56px; margin: 0; text-shadow: 0 4px 20px #000a; }
</style>
</head>
<body>
  <audio src="assets/music.m4a" data-volume="0.5" data-fade-in="0.5" data-fade-out="1.5"></audio>
  <div class="brand" data-duration="10.8" data-enter="fade 0.6" data-exit="fade 0.4">Bean There</div>

  <main data-sequence data-transition="fade 0.5">
    <!-- 1: kinetic type -->
    <section class="scene" data-duration="3.4">
      <mw-include src="blocks/gradient-bg.html" c1="#8a4b22" c2="#e8a25a" c3="#3b1f10" base="#1a110b"></mw-include>
      <mw-include src="blocks/word-pop.html" text="Mornings|are|*better*|at|*Bean There*" every="0.55" size="200" accent="#ffcf8a"></mw-include>
    </section>

    <!-- 2: steaming cup (JS-driven) -->
    <section class="scene" id="cupScene" data-duration="4.6">
      <mw-include src="blocks/gradient-bg.html" c1="#3b1f10" c2="#8a4b22" c3="#c7773b" base="#140c07"></mw-include>
      <div class="cupwrap">
        <svg viewBox="0 0 320 380" data-enter="rise 0.8">
          <defs>
            <linearGradient id="cupg" x1="0" x2="1"><stop offset="0" stop-color="#fdf3e6"/><stop offset="1" stop-color="#e7d3b8"/></linearGradient>
          </defs>
          <g id="steam" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="10">
            <path class="s"/><path class="s"/><path class="s"/>
          </g>
          <ellipse cx="160" cy="352" rx="140" ry="18" fill="#00000055"/>
          <path d="M60 200 h200 l-18 130 a20 20 0 0 1 -20 18 h-124 a20 20 0 0 1 -20 -18 z" fill="url(#cupg)"/>
          <path d="M258 222 c50 0 50 70 -10 74" stroke="#e7d3b8" stroke-width="16" fill="none"/>
          <ellipse cx="160" cy="200" rx="100" ry="16" fill="#6b3d22"/>
          <ellipse cx="160" cy="198" rx="60" ry="7" fill="#c98a5a" opacity=".7"/>
        </svg>
        <h2 class="headline" data-split="words" data-enter="fade-up 0.6 0.5" data-stagger="0.08">Fresh roasted.<br><span class="accent">Slow poured.</span></h2>
      </div>
    </section>

    <!-- 3: price count-up -->
    <section class="scene" data-duration="4">
      <mw-include src="blocks/gradient-bg.html" c1="#7a3f1c" c2="#3b1f10" c3="#a8622f" base="#140c07"></mw-include>
      <div class="price">
        <div class="kicker" data-enter="fade-down 0.5">Today only</div>
        <div class="tag" data-enter="pop 0.6 0.1"><span data-count="0 3.50" data-count-decimals="2" data-count-prefix="$" data-count-duration="1.4" data-count-delay="0.2"></span></div>
        <div class="what" data-split="chars" data-enter="fade-up 0.5 0.9" data-stagger="0.04">Oat latte</div>
      </div>
    </section>

    <!-- 4: end card -->
    <section class="scene" data-duration="4.5">
      <mw-include src="blocks/gradient-bg.html" c1="#8a4b22" c2="#3b1f10" c3="#e8a25a" base="#140c07"></mw-include>
      <div class="end">
        <img src="assets/logo.svg" alt="" data-enter="pop 0.7">
        <h1 data-split="chars" data-enter="rise 0.6 0.3" data-stagger="0.04">Bean There</h1>
        <p data-enter="fade-up 0.6 0.9">Open daily from 7am</p>
      </div>
    </section>
  </main>

  <mw-include src="blocks/captions.html" file="assets/captions.json" position="bottom" size="46" words="3" accent="#ffcf8a"></mw-include>

<script>
  const paths = document.querySelectorAll('#steam .s');
  mw.onFrame('#cupScene', (t) => {
    paths.forEach((p, i) => {
      const x0 = 110 + i * 50;
      const phase = t * 2.2 + i * 1.7;
      const pts = [];
      for (let k = 0; k <= 12; k++) {
        const y = 185 - k * 14;
        const sway = Math.sin(phase - k * 0.55) * (4 + k * 1.4);
        pts.push(`${(x0 + sway).toFixed(1)} ${y}`);
      }
      p.setAttribute('d', 'M' + pts.join(' L'));
      const rise = (t * 0.6 + i * 0.33) % 1;      // loops 0..1
      p.style.translate = `0 ${-rise * 30}px`;
      p.style.opacity = (0.55 * Math.sin(rise * Math.PI) * Math.min(1, t / 0.8)).toFixed(3);
    });
  });
</script>
</body>
</html>
