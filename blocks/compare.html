<!-- block:
description: Before/after comparison: a divider sweeps across to reveal the "after" image. Labels on both sides.
params: before (image), after (image), before-label, after-label, width (px at 1080p; scales with the short side, default 1500), height (default 840), from (0-100, default 100), to (0-100, default 30)
usage: <gm-include src="blocks/compare.html" before="assets/old.png" after="assets/new.png" before-label="Before" after-label="After" data-duration="4"></gm-include>
-->
<div class="gmb-cmp" style="--w:{{width|1500}};--h:{{height|840}}" data-from="{{from|100}}" data-to="{{to|30}}" data-enter="scale 0.7">
  <img class="gmb-cmp__img" src="{{after}}" alt="">
  <div class="gmb-cmp__before"><img class="gmb-cmp__img" src="{{before}}" alt=""></div>
  <div class="gmb-cmp__line"><div class="gmb-cmp__knob">⟷</div></div>
  <div class="gmb-cmp__tag gmb-cmp__tag--l">{{before-label|Before}}</div>
  <div class="gmb-cmp__tag gmb-cmp__tag--r">{{after-label|After}}</div>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const from = parseFloat(root.dataset.from), to = parseFloat(root.dataset.to);
  const before = root.querySelector('.gmb-cmp__before'), line = root.querySelector('.gmb-cmp__line');
  gm.onFrame(root, (t, f) => {
    const p = gm.interpolate(t, [0.7, Math.min(f.clipDuration - 0.5, 2.6)], [from, to], { easing: 'in-out-cubic' });
    before.style.clipPath = `inset(0 ${100 - p}% 0 0)`;
    line.style.left = p + '%';
  });
})();
</script>
<style>
.gmb-cmp{position:relative;width:calc(var(--px)*var(--w));height:calc(var(--px)*var(--h));max-width:calc(var(--stage-w,1920px) - var(--px)*120);border-radius:calc(var(--px)*24);overflow:hidden;background:#111;box-shadow:0 calc(var(--px)*40) calc(var(--px)*120) rgba(0,0,0,.45)}
.gmb-cmp__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gmb-cmp__before{position:absolute;inset:0}
.gmb-cmp__line{position:absolute;top:0;bottom:0;width:calc(var(--px)*4);margin-left:calc(var(--px)*-2);background:#fff;box-shadow:0 0 calc(var(--px)*20) rgba(0,0,0,.5)}
.gmb-cmp__knob{position:absolute;top:50%;left:50%;translate:-50% -50%;width:calc(var(--px)*68);height:calc(var(--px)*68);border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:calc(var(--px)*34);font-weight:700}
.gmb-cmp__tag{position:absolute;top:calc(var(--px)*28);padding:calc(var(--px)*10) calc(var(--px)*22);border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:calc(var(--px)*30);font-weight:700;backdrop-filter:blur(8px)}
.gmb-cmp__tag--l{left:calc(var(--px)*28)} .gmb-cmp__tag--r{right:calc(var(--px)*28)}
</style>
