<!-- block:
description: Word-by-word captions (TikTok/Reels style) from a word-timed JSON file or an .srt file. The spoken word is highlighted.
params: file (captions.json or .srt), words (max words per line, default 5), accent (color), position (bottom|center|top), offset (distance from the top/bottom edge in px at 1080p; default 120, or 420 on vertical video to stay above the app buttons), size (px at 1080p; scales with the short side, default 64), weight (font weight, default 800), upper (true = UPPERCASE)
hold: seconds the last line stays after its last word (default 0.8; 0 = gone with the word, so it does not run into the next scene).
Paging: lines break at sentence ends, pauses and commas, and are balanced, so a line never holds one lonely word.
usage: <gm-include src="blocks/captions.html" file="captions.json"></gm-include>   JSON: [{"word":"Hello","start":0.2,"end":0.5}, …] (times in seconds, relative to the block's start)
-->
<div class="gmb-cap gmb-cap--{{position|bottom}}" style="--accent:{{accent|#ffd23f}};--size:{{size|64}};--weight:{{weight|800}}" data-file="{{file}}" data-words="{{words|5}}" data-offset="{{offset}}" data-upper="{{upper}}" data-hold="{{hold|0.8}}"><div class="gmb-cap__line"></div></div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const line = root.firstElementChild;
  const file = root.dataset.file;
  const maxWords = Math.max(1, parseInt(root.dataset.words, 10) || 5);
  const off = parseFloat(root.dataset.offset);
  root.style.setProperty('--off', isFinite(off) ? off : gm.height > gm.width ? 420 : 120);
  if (/^(true|1|yes)$/i.test(root.dataset.upper)) line.style.textTransform = 'uppercase';
  let pages = [];
  const parseSrt = (txt) => txt.replace(/\r/g, '').split(/\n\n+/).map((b) => {
    const m = /(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/.exec(b);
    if (!m) return null;
    const t = (h, mi, s, ms) => +h * 3600 + +mi * 60 + +s + +ms / 1000;
    const text = b.split('\n').slice(2).join(' ').trim();
    return { start: t(m[1], m[2], m[3], m[4]), end: t(m[5], m[6], m[7], m[8]), text };
  }).filter(Boolean);
  const build = (words) => {
    // 1) split into phrases at sentence ends and pauses; 2) split long phrases into even chunks (no orphan words)
    const phrases = [];
    let cur = [];
    words.forEach((w, i) => {
      const prev = words[i - 1];
      if (cur.length && ((prev && w.start - prev.end > 0.6) || /[.!?…]$/.test(prev.word))) { phrases.push(cur); cur = []; }
      cur.push(w);
    });
    if (cur.length) phrases.push(cur);
    const out = [];
    // Best split of each phrase into lines of at most maxWords: lines of similar length that end at
    // punctuation, never a lonely single word, and never a line that runs across a comma.
    const soft = (w) => /[,;:\u2013\u2014]$/.test(w.word);
    for (const ph of phrases) {
      const n = ph.length;
      const best = [0], from = [0];
      for (let i = 1; i <= n; i++) {
        best[i] = Infinity;
        for (let j = Math.max(0, i - maxWords); j < i; j++) {
          const len = i - j;
          let c = best[j] + 1 + 0.5 * (maxWords - len) ** 2;
          if (len === 1 && n > 1) c += 50;
          if (i < n && !soft(ph[i - 1])) c += 3;
          for (let k = j; k < i - 1; k++) if (soft(ph[k])) c += 4;
          if (c < best[i]) { best[i] = c; from[i] = j; }
        }
      }
      const cuts = [];
      for (let i = n; i > 0; i = from[i]) cuts.unshift([from[i], i]);
      for (const [a, b] of cuts) out.push(ph.slice(a, b));
    }
    return out.map((ws) => ({ start: ws[0].start, end: ws[ws.length - 1].end, words: ws }));
  };
  gm.wait(fetch(file).then((r) => { if (!r.ok) throw new Error('captions file not found: ' + file); return r.text(); }).then((txt) => {
    let words;
    if (/\.srt$/i.test(file)) {
      words = [];
      for (const seg of parseSrt(txt)) {
        const ws = seg.text.split(/\s+/).filter(Boolean);
        const d = (seg.end - seg.start) / ws.length;
        ws.forEach((w, i) => words.push({ word: w, start: seg.start + i * d, end: seg.start + (i + 1) * d }));
      }
    } else {
      const j = JSON.parse(txt);
      words = (Array.isArray(j) ? j : j.words || j.segments?.flatMap((s) => s.words || []) || []).map((w) => ({ word: String(w.word ?? w.text ?? '').trim(), start: +(w.start ?? w.t0 ?? 0), end: +(w.end ?? w.t1 ?? 0) })).filter((w) => w.word);
    }
    pages = build(words);
    root.__gmPages = pages; // read by `givemotion captions` (paging preview)
  }));
  let shown = -1;
  gm.onFrame(root, (t) => {
    const hold = parseFloat(root.dataset.hold); const H = isFinite(hold) ? hold : 0.8;
    let pi = pages.findIndex((p, i) => t >= p.start - 0.05 && t < (pages[i + 1] ? Math.min(pages[i + 1].start - 0.05, p.end + H) : p.end + H));
    if (pi !== shown) {
      shown = pi;
      line.innerHTML = pi < 0 ? '' : pages[pi].words.map((w) => `<span class="gmb-cap__w">${w.word.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</span>`).join(' ');
    }
    if (pi < 0) return;
    const p = pages[pi];
    const spans = line.children;
    p.words.forEach((w, i) => {
      const s = spans[i];
      const on = t >= w.start && t < (p.words[i + 1] ? p.words[i + 1].start : w.end + H);
      const pop = gm.interpolate(t - w.start, [0, 0.12], [0.92, 1], { easing: 'out-back' });
      s.classList.toggle('is-on', on);
      s.classList.toggle('is-past', t >= w.end && !on);
      s.style.scale = on ? pop : 1;
      s.style.opacity = t < w.start ? 0.55 : 1;
    });
    const enter = gm.interpolate(t - p.start, [0, 0.18], [0, 1], { easing: 'out-cubic' });
    line.style.opacity = enter;
    line.style.translate = `0 ${(1 - enter) * 16}px`;
  });
})();
</script>
<style>
.gmb-cap{position:absolute;left:0;right:0;display:flex;justify-content:center;padding:0 calc(var(--px)*120);pointer-events:none;z-index:20}
.gmb-cap--bottom{bottom:calc(var(--px)*var(--off,120))} .gmb-cap--top{top:calc(var(--px)*var(--off,120))} .gmb-cap--center{top:50%;translate:0 -50%}
.gmb-cap__line{max-width:22ch;text-align:center;font-size:calc(var(--px)*var(--size));font-weight:var(--weight,800);line-height:1.18;color:#fff;letter-spacing:-.01em;
  text-shadow:0 calc(var(--px)*4) calc(var(--px)*18) rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6);text-wrap:balance}
.gmb-cap__w{display:inline-block;padding:0 .12em;border-radius:.18em;transition:none}
.gmb-cap__w.is-on{color:#111;background:var(--accent);text-shadow:none}
</style>
