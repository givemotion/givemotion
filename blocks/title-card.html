<!-- block:
description: Big headline with optional kicker and subtitle. Words rise in one by one.
params: title, subtitle, kicker, accent (color), align (center|left)
usage: <gm-include src="blocks/title-card.html" kicker="Chapter 1" title="Ship faster" subtitle="Automate the boring parts" data-duration="4"></gm-include>
-->
<div class="gmb-title gmb-title--{{align|center}}" style="--accent:{{accent|#7c9cff}}">
  <div class="gmb-title__kicker" data-enter="fade-up 0.6 0 out-expo">{{kicker}}</div>
  <h1 class="gmb-title__h" data-split="words" data-enter="rise 0.9 0.1" data-stagger="0.07">{{title|Your title here}}</h1>
  <div class="gmb-title__line"></div>
  <p class="gmb-title__sub" data-enter="fade-up 0.7 0.55">{{subtitle}}</p>
</div>
<style>
.gmb-title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 calc(var(--px)*160);gap:calc(var(--px)*26)}
.gmb-title--left{align-items:flex-start;text-align:left}
.gmb-title__kicker{font-size:calc(var(--px)*30);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in oklab,var(--accent),white 30%);text-shadow:0 1px calc(var(--px)*14) rgba(0,0,0,.45)}
.gmb-title__h{margin:0;font-size:calc(var(--px)*132);line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:16ch;text-wrap:balance}
.gmb-title__line{margin:calc(var(--px)*10) 0;width:calc(var(--px)*120);height:calc(var(--px)*8);border-radius:99px;background:var(--accent);transform-origin:left;animation:gmb-title-line .9s var(--ease-out-expo) .45s both}
.gmb-title--center .gmb-title__line{transform-origin:center}
.gmb-title__sub{margin:0;font-size:calc(var(--px)*44);line-height:1.3;opacity:.8;text-shadow:0 1px calc(var(--px)*14) rgba(0,0,0,.4);max-width:30ch;text-wrap:balance}
.gmb-title__kicker:empty,.gmb-title__sub:empty{display:none}
@keyframes gmb-title-line{from{scale:0 1}}
</style>
