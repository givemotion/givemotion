<!doctype html>
<!-- analyze benchmark (tuning): full-frame scene changes on plain colored backgrounds.
     cut, fade, dip, iris, push-left. Text enters inside the shots (must not count as scene changes). -->
<html data-width="1280" data-height="720" data-fps="30">
<head>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
  .scene { overflow: hidden; }
  h1 { position: absolute; margin: 0; font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  p { position: absolute; margin: 0; font-size: 34px; font-weight: 600; opacity: .85; }
  .dot { position: absolute; border-radius: 50%; }
  .box { position: absolute; border-radius: 28px; }
</style>
</head>
<body>
<main data-sequence>
  <section class="scene" data-duration="2.2" style="background:#1b2a6b">
    <h1 style="left:80px;top:220px" data-enter="fade-up 0.5 0.1">ALPHA</h1>
    <p style="left:86px;top:400px" data-enter="fade 0.4 0.5">first scene, a blue field</p>
    <div class="dot" style="right:120px;top:180px;width:300px;height:300px;background:#f2c14e" data-enter="pop 0.6 0.3"></div>
  </section>
  <section class="scene" data-duration="2.2" style="background:#e8e1d3;color:#14110f" data-camera="push 1.06">
    <h1 style="right:90px;top:120px" data-enter="fade-left 0.5 0.2">BRAVO</h1>
    <div class="box" style="left:100px;top:300px;width:520px;height:300px;background:#d1495b" data-enter="scale 0.5 0.4"></div>
    <p style="right:96px;top:300px;color:#14110f" data-enter="fade 0.4 0.8">a hard cut, light paper</p>
  </section>
  <section class="scene" data-duration="2.4" data-transition="fade 0.6" style="background:#2d6a4f">
    <h1 style="left:380px;top:260px" data-enter="rise 0.6 0.3">CHARLIE</h1>
    <div class="dot" style="left:120px;top:90px;width:160px;height:160px;background:#b7e4c7" data-enter="pop 0.5 0.6"></div>
    <div class="dot" style="right:160px;bottom:80px;width:110px;height:110px;background:#081c15" data-enter="pop 0.5 0.8"></div>
  </section>
  <section class="scene" data-duration="2.4" data-transition="dip 0.8" style="background:#6b2737">
    <h1 style="left:90px;bottom:120px" data-enter="fade-up 0.5 0.4">DELTA</h1>
    <div class="box" style="right:90px;top:90px;width:360px;height:360px;background:#f7b267;rotate:12deg" data-enter="spin-in 0.7 0.3"></div>
  </section>
  <section class="scene" data-duration="2.4" data-transition="iris 0.6" style="background:#f4a261;color:#1d1d1d" data-camera="pull 1.06">
    <h1 style="left:300px;top:110px" data-enter="fade-down 0.5 0.4">ECHO</h1>
    <div class="box" style="left:200px;top:340px;width:880px;height:120px;background:#264653" data-enter="grow-x 0.6 0.5"></div>
    <p style="left:210px;top:500px;color:#1d1d1d" data-enter="fade 0.4 0.9">an iris opens from the center</p>
  </section>
  <section class="scene" data-duration="2.4" data-transition="push-left 0.5" style="background:#264653">
    <h1 style="left:120px;top:300px" data-enter="fade-right 0.5 0.4">FOXTROT</h1>
    <div class="dot" style="right:70px;top:60px;width:220px;height:220px;background:#e76f51" data-enter="pop 0.5 0.6"></div>
  </section>
</main>
</body>
</html>
