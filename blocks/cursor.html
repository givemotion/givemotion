<!-- block:
description: A mouse pointer that glides between points and clicks. Points are "x,y" in px (1080p frame); add ! to click there. Times in seconds (one per point).
params: points (e.g. "400,300 900,520! 1300,600!"), times (e.g. "0 1 2.2"), size (px, default 44)
usage: <mw-include src="blocks/cursor.html" points="300,800 960,540! 1500,300!" times="0.2 1.2 2.4" data-duration="4"></mw-include>
-->
<div class="mwb-cursor" style="--s:{{size|44}}" data-points="{{points|200,800 960,540!}}" data-times="{{times}}">
  <div class="mwb-cursor__ring"></div>
  <svg class="mwb-cursor__arrow" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6-3.4 6.2z"/></svg>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const arrow = root.querySelector('.mwb-cursor__arrow'), ring = root.querySelector('.mwb-cursor__ring');
  const pts = root.dataset.points.trim().split(/\s+/).map((p) => { const click = p.endsWith('!'); const [x, y] = p.replace('!', '').split(',').map(Number); return { x, y, click }; });
  const ts = root.dataset.times ? root.dataset.times.trim().split(/\s+/).map(Number) : pts.map((_, i) => 0.3 + i * 1.1);
  const S = () => mw.height / 1080;
  mw.onFrame(root, (t) => {
    let i = 0;
    while (i < pts.length - 1 && t >= ts[i + 1]) i++;
    let x = pts[i].x, y = pts[i].y;
    if (i < pts.length - 1 && t > ts[i]) {
      const seg = ts[i + 1] - ts[i], move = Math.min(seg, 0.9);
      const p = mw.interpolate(t, [ts[i + 1] - move, ts[i + 1]], [0, 1], { easing: 'in-out-cubic' });
      // slight arc for natural motion
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = Math.min(pts[i].y, pts[i + 1].y) - 60;
      const q = (a, b, c) => (1 - p) * (1 - p) * a + 2 * (1 - p) * p * b + p * p * c;
      x = q(pts[i].x, mx, pts[i + 1].x); y = q(pts[i].y, my, pts[i + 1].y);
    }
    // click: press + ripple right after arriving at a point marked with !
    let press = 1, rp = -1;
    pts.forEach((pt, k) => {
      if (!pt.click) return;
      const dt = t - ts[k];
      if (dt >= 0 && dt < 0.6) { rp = dt / 0.6; press = Math.min(press, 1 - 0.18 * Math.sin(Math.min(1, dt / 0.22) * Math.PI)); }
    });
    root.style.translate = `${x * S()}px ${y * S()}px`;
    arrow.style.scale = press;
    ring.style.opacity = rp < 0 ? 0 : 1 - rp;
    ring.style.scale = rp < 0 ? 0 : 0.3 + rp * 1.4;
    root.style.opacity = mw.interpolate(t, [0, 0.25], [0, 1]);
  });
})();
</script>
<style>
.mwb-cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:50;pointer-events:none}
.mwb-cursor__arrow{position:absolute;left:calc(var(--px)*-4);top:calc(var(--px)*-3);width:calc(var(--px)*var(--s));height:calc(var(--px)*var(--s));transform-origin:15% 10%;filter:drop-shadow(0 calc(var(--px)*4) calc(var(--px)*8) rgba(0,0,0,.4))}
.mwb-cursor__arrow path{fill:#111;stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.mwb-cursor__ring{position:absolute;width:calc(var(--px)*110);height:calc(var(--px)*110);left:calc(var(--px)*-55);top:calc(var(--px)*-55);border-radius:50%;border:calc(var(--px)*4) solid rgba(255,255,255,.9);background:rgba(255,255,255,.15);opacity:0}
</style>
