<!-- block:
description: Subtle tech background: a slowly drifting line grid (or dots) with a soft glow and vignette. Put it anywhere inside a .scene: it always sits behind the scene content (no z-index needed).
params: base (background color), line (grid color), glow (color), size (cell px at 1080p, default 64), pattern (lines|dots)
usage: <gm-include src="blocks/grid-bg.html" glow="#3b82f6"></gm-include>
-->
<div class="gmb-gridbg gmb-gridbg--{{pattern|lines}}" style="--base:{{base|#07090f}};--line:{{line|rgba(255,255,255,.08)}};--glow:{{glow|#4f7cff}};--cell:{{size|64}}">
  <div class="gmb-gridbg__glow"></div><div class="gmb-gridbg__grid"></div><div class="gmb-gridbg__vig"></div>
</div>
<style>
.gmb-gridbg{position:absolute;inset:0;overflow:hidden;background:var(--base);z-index:-1}
.gmb-gridbg__grid{position:absolute;inset:calc(var(--px)*var(--cell)*-1);--c:calc(var(--px)*var(--cell));will-change:translate;animation:gmb-gridbg-drift 12s linear infinite}
.gmb-gridbg--lines .gmb-gridbg__grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--c) var(--c)}
.gmb-gridbg--dots .gmb-gridbg__grid{background-image:radial-gradient(var(--line) calc(var(--px)*2.2),transparent calc(var(--px)*2.6));background-size:var(--c) var(--c);filter:brightness(1.8)}
.gmb-gridbg__vig{position:absolute;inset:0;background:radial-gradient(ellipse 62% 62% at 50% 45%,transparent 35%,var(--base) 80%)}
.gmb-gridbg__glow{position:absolute;left:50%;top:40%;width:80%;aspect-ratio:2;translate:-50% -50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--glow),transparent 70%),transparent);will-change:opacity;animation:gmb-gridbg-breathe 6s ease-in-out infinite alternate}
@keyframes gmb-gridbg-drift{to{translate:calc(var(--px)*var(--cell)) calc(var(--px)*var(--cell))}}
@keyframes gmb-gridbg-breathe{from{opacity:.65}to{opacity:1}}
</style>
