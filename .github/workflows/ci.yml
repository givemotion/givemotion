name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      # Ubuntu runners block the user namespaces Chrome's sandbox needs; the runner is already isolated.
      GIVEMOTION_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: node src/cli.js doctor
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
